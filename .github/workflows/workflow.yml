name: gpuvmem CI

on:
  push:
    branches: [master, framework_dev, development]
    paths:
    - '**.cu'
    - '**.cuh'
    - '**.c'
    - '**.h'
    - '**.cpp'
    - '**.hpp'
    - '**.cmake'
    - CMakeLists.txt
  pull_request:
    branches: [master]
    types: [opened, reopened]
    paths:
    - '**.cu'
    - '**.cuh'
    - '**.c'
    - '**.h'
    - '**.cpp'
    - '**.hpp'
    - '**.cmake'
    - CMakeLists.txt

env:
  BUILD_DIR: build
  CONFIG: Debug
  CUDA_ARCH: 75  # Default architecture for CI (Turing - widely supported)

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:base
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.REGISTRY_TOKEN }}

    steps:
    - name: Verify CUDA toolkit (compile-only on typical GitHub runners)
      run: |
        nvcc --version
        test -f /usr/local/cuda/bin/nvcc
        echo "CUDA toolkit verified (device may be absent on hosted runners)"

    - name: Detect CUDA device
      id: cuda
      run: |
        if command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi -L >/dev/null 2>&1; then
          echo "GPU runner: $(nvidia-smi -L | head -1)"
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "No GPU visible (expected on github-hosted runners)."
          echo "available=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install Git LFS
      run: |
        apt-get update
        apt-get install -y --no-install-recommends git-lfs
        rm -rf /var/lib/apt/lists/*

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Configure CMake
      id: configure
      run: |
        cmake . -B ${{ env.BUILD_DIR }} \
               -DCMAKE_BUILD_TYPE=${{ env.CONFIG }} \
               -DCUDA_ARCH=${{ env.CUDA_ARCH }} \
               -DGPUVMEM_BUILD_TESTS=ON

    - name: Show CMake configuration errors
      if: failure() && steps.configure.outcome == 'failure'
      working-directory: ${{ env.BUILD_DIR }}
      run: |
        echo "=== CMake Configuration Errors ==="
        if [[ -f "CMakeFiles/CMakeOutput.log" ]]; then
          echo "---- CMakeFiles/CMakeOutput.log ----"
          tail -100 CMakeFiles/CMakeOutput.log
          echo "----"
        fi
        if [[ -f "CMakeFiles/CMakeError.log" ]]; then
          echo "---- CMakeFiles/CMakeError.log ----"
          tail -100 CMakeFiles/CMakeError.log
          echo "----"
        fi

    - name: Build gpuvmem
      working-directory: ${{ env.BUILD_DIR }}
      run: |
        cmake --build . --verbose -j$(nproc)

    - name: Unit tests without GPU (ctest label gpu excluded)
      working-directory: ${{ env.BUILD_DIR }}
      run: ctest -L unit -LE gpu --output-on-failure

    - name: Integration tests without GPU (ctest label gpu excluded)
      working-directory: ${{ env.BUILD_DIR }}
      run: ctest -L integration -LE gpu --output-on-failure

    - name: GPU unit tests
      if: steps.cuda.outputs.available == 'true'
      working-directory: ${{ env.BUILD_DIR }}
      run: ctest -L 'unit;gpu' --output-on-failure

    - name: GPU integration tests
      if: steps.cuda.outputs.available == 'true'
      working-directory: ${{ env.BUILD_DIR }}
      run: ctest -L 'integration;gpu' --output-on-failure

    - name: GPU tests skipped (no device)
      if: steps.cuda.outputs.available != 'true'
      run: |
        echo "Skipped ctest -L gpu (objective CUDA, projection kernels, optimizer smoke)."
        echo "Run locally with a GPU or use a self-hosted runner with nvidia-smi."

    - name: Verify build output
      run: |
        if [[ -f "${{ env.BUILD_DIR }}/bin/gpuvmem" ]]; then
          echo "Build successful: gpuvmem binary found"
          ls -lh ${{ env.BUILD_DIR }}/bin/gpuvmem
        else
          echo "Warning: gpuvmem binary not found in expected location"
          find ${{ env.BUILD_DIR }} -name "gpuvmem" -type f || true
        fi
